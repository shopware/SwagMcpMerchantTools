name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  COMPOSER_ALLOW_SUPERUSER: 1
  COMPOSER_PLUGIN_LOADER: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: shopware/github-actions/setup-extension@main
        with:
          extensionName: ${{ github.event.repository.name }}
          install: true
          phpVersion: "8.2"
          shopwareVersion: poc/mcp-bundle

      - run: symfony composer -d custom/plugins/${{ github.event.repository.name }} run phpstan

  codestyle:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: shopware/github-actions/cs-fixer@main
        with:
          rules: ""

  phpunit:
    name: PHPUnit (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: shopware/github-actions/setup-extension@main
        with:
          extensionName: ${{ github.event.repository.name }}
          install: true
          phpVersion: "8.2"
          shopwareVersion: poc/mcp-bundle

      - run: symfony composer -d custom/plugins/${{ github.event.repository.name }} run test -- --testsuite unit

  mcp-registration:
    name: MCP Tool Registration
    runs-on: ubuntu-latest
    env:
      MCP_SERVER: 1
    steps:
      - uses: shopware/github-actions/setup-extension@main
        with:
          extensionName: ${{ github.event.repository.name }}
          install: true
          phpVersion: "8.2"
          shopwareVersion: poc/mcp-bundle

      - name: Assert merchant MCP tools and prompt are registered
        run: |
          set -euo pipefail
          output=$(symfony console debug:mcp)
          echo "$output"
          expected=(
            merchant-order-summary
            merchant-customer-lookup
            merchant-product-create
            merchant-revenue-report
            merchant-bestseller-report
            merchant-storefront-search
            merchant-cart-manage
            merchant-cart-checkout
            merchant-checkout-methods
            merchant-context
          )
          missing=()
          for name in "${expected[@]}"; do
            grep -Fq "$name" <<< "$output" || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing MCP capabilities: ${missing[*]}"
            exit 1
          fi
